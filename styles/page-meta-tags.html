<!-- Page-Specific Meta Tags Template -->
<!-- Replace the content values with page-specific information -->

<!-- Primary Meta Tags -->
<meta name="description" content="[Page-specific description]">
<meta name="keywords" content="[Page-specific keywords]">

<!-- Open Graph / Facebook -->
<meta property="og:title" content="[Page Title] - MedadMed Clinic">
<meta property="og:description" content="[Page-specific description]">
<meta property="og:url" content="[Page URL]">
<meta property="og:image" content="[Page-specific image URL]">

<!-- Twitter -->
<meta property="twitter:title" content="[Page Title] - MedadMed Clinic">
<meta property="twitter:description" content="[Page-specific description]">
<meta property="twitter:image" content="[Page-specific image URL]">

<!-- Canonical URL -->
<link rel="canonical" href="[Page URL]">

<!-- Page-Specific Structured Data -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebPage",
  "name": "[Page Title]",
  "description": "[Page-specific description]",
  "url": "[Page URL]",
  "breadcrumb": {
    "@type": "BreadcrumbList",
    "itemListElement": [{
      "@type": "ListItem",
      "position": 1,
      "name": "Home",
      "item": "https://www.medadmed.uz/"
    }, {
      "@type": "ListItem",
      "position": 2,
      "name": "[Parent Page]",
      "item": "[Parent Page URL]"
    }, {
      "@type": "ListItem",
      "position": 3,
      "name": "[Current Page]",
      "item": "[Current Page URL]"
    }]
  }
}
</script>

<!-- Language Alternates -->
<link rel="alternate" hreflang="uz" href="[Uzbek version URL]">
<link rel="alternate" hreflang="ru" href="[Russian version URL]">
<link rel="alternate" hreflang="x-default" href="[Default version URL]">
